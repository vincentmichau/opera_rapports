name: Build Windows packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Test
        run: pytest
      - name: Build PyInstaller onedir bundle
        run: |
          pyinstaller --noconfirm --clean --windowed --name opera-rapports --collect-all PySide6 --collect-data opera_rapports src/opera_rapports/app.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installable EXE
        run: iscc packaging\inno\setup.iss
      - name: Install WiX Toolset
        run: choco install wixtoolset --yes --no-progress
      - name: Harvest MSI files
        shell: pwsh
        run: |
          heat dir dist\opera-rapports -cg AppFiles -dr INSTALLFOLDER -srd -sreg -gg -var var.SourceDir -out packaging\wix\AppFiles.wxs
          candle -dSourceDir=dist\opera-rapports packaging\wix\Product.wxs packaging\wix\AppFiles.wxs
          light -out OperaRapports.msi Product.wixobj AppFiles.wixobj
      - name: Build PortableApps archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable\OperaRapportsPortable\App\OperaRapports | Out-Null
          Copy-Item dist\opera-rapports\* portable\OperaRapportsPortable\App\OperaRapports -Recurse
          Copy-Item packaging\portableapps\AppInfo portable\OperaRapportsPortable\AppInfo -Recurse
          Compress-Archive portable\OperaRapportsPortable OperaRapportsPortable.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            packaging/inno/Output/*.exe
            OperaRapports.msi
            OperaRapportsPortable.zip
